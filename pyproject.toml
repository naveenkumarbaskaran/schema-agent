[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schema-agent-ai"
version = "0.1.0"
description = "Infer, document, and validate database schemas using LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "schema-agent contributors" },
]
keywords = ["database", "schema", "llm", "ai", "documentation", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary"]
mysql = ["pymysql"]
mssql = ["pyodbc"]
oracle = ["cx_oracle"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
schema-agent = "schema_agent.cli:main"

[project.urls]
Repository = "https://github.com/example/schema-agent-ai"

[tool.hatch.build.targets.wheel]
packages = ["schema_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
